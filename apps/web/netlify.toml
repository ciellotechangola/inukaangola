# =============================================================================
#  NETLIFY — INUKA Angola (Next.js com servidor)
# =============================================================================
#  Este ficheiro vive DENTRO de apps/web de propósito. Quando o `base` está no
#  netlify.toml da raiz do monorepo, o caminho `publish` é resolvido contra a
#  raiz e o runtime do Next não encontra `.next` (erro "Your publish directory
#  was not found"). Aqui não há `base`: o directório do projecto é este.
#
#  NÃO tentes publicar arrastando a pasta para https://app.netlify.com/drop.
#  O Drop só aceita ficheiros estáticos, e esta app tem Server Components,
#  rotas `/api/*`, middleware (`src/proxy.ts`) e sessão em cookie — precisa de
#  um servidor Node. É por isso que o Drop responde
#  "We couldn't deploy the files you dropped" e depois "Access Denied".
#
#  SITUAÇÃO CONHECIDA — actualizado a 2026-11-04 com build real do Netlify
#  (`npx netlify-cli build`, @netlify/build 37.7.5, plugin 5.16.6).
#
#  O build do Next passa; falha sempre no passo "Bundling of edge function".
#  O plugin gera um handler de edge para o middleware Node e copia
#  `.next/server/middleware.js` para dentro dele **sem os ficheiros irmãos**
#  de que esse ficheiro depende. O erro concreto muda com o bundler:
#
#    • Turbopack (omissão no Next 16):
#        Error: Cannot find module './chunks/[turbopack]_runtime.js'
#        (Require stack: .../server/.next/server/middleware.js)
#
#    • Webpack (`next build --webpack`):
#        Error: Failed to compile CJS module: .../server/.next/server/middleware.js
#        [cause]: Error: Cannot find module './webpack-runtime.js'
#
#  Confirmação de que é do plugin e não do build: `.next/server/webpack-runtime.js`
#  existe no build normal, mas a pasta `server/.next/server/` do edge function
#  fica sem nada. É o plugin a copiar mal, não o Next a produzir mal.
#
#  Já testado sem resultado:
#    • `next build --webpack` — troca um erro pelo outro (ver acima).
#    • 5.16.6 é a versão mais recente publicada (2026-11-03 19:49 UTC); não há
#      canary mais nova, e não existe adaptador alternativo no npm
#      (`@opennextjs/netlify` e `opennextjs-netlify` não existem).
#    • O Drop (arrastar a pasta) nunca vai funcionar: só aceita estáticos.
#
#  Mesmo que os ficheiros fossem copiados, o `middleware.js` ainda faz
#  `require("next/dist/server/…external.js")` (9 módulos), que o runtime Deno
#  do Netlify teria de resolver. Não vale a pena forçar: seria remendar um bug
#  de terceiros com um plugin caseiro, frágil a cada actualização.
#
#  Enquanto não sair correcção no @netlify/plugin-nextjs, publica-se por
#  WorkBuddy Sites (ver README) ou por Vercel, que corre Next 16 sem runtime
#  próprio.
#
#  Publicar:
#    a) CLI, a partir de apps/web:
#         npx netlify-cli deploy --build --prod --site <site-id>
#    b) Git: em Netlify, Base directory = `apps/web` e Build command =
#       `npm run build`. O Netlify lê este ficheiro a partir da base.
#
#  Variáveis de ambiente no site (Site configuration > Environment variables):
#      NEXT_PUBLIC_SUPABASE_URL        (build + runtime)
#      NEXT_PUBLIC_SUPABASE_ANON_KEY   (build + runtime)
#      SUPABASE_SERVICE_ROLE_KEY       (segredo, só runtime)
# =============================================================================

[build]
  # A instalação de dependências é um passo próprio do Netlify (`npm ci` a
  # partir do package-lock.json). Repeti-la aqui apagava `node_modules` a meio
  # do build sem necessidade.
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 exige Node >= 20.9.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runtime oficial: converte as rotas do Next em funções do Netlify, serve os
# estáticos e mantém o middleware. Sem este plugin o deploy publica apenas
# `.next/static` e todas as páginas dão 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
