<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>INUKA — sem ligação</title>
    <meta name="theme-color" content="#0A0A0A" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 32px 28px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      img {
        width: 104px;
        height: 104px;
        border-radius: 24px;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        font-size: 15px;
        line-height: 1.55;
        color: #a1a1a1;
      }
      button {
        margin-top: 6px;
        padding: 14px 30px;
        border: 0;
        border-radius: 999px;
        background: #c9a962;
        color: #0a0a0a;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        opacity: 0.75;
      }
      .marca {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #6b6b6b;
      }
    </style>
  </head>
  <body>
    <img src="logo-inuka.png" alt="" />
    <div>
      <h1>Sem ligação à internet</h1>
      <p>
        A INUKA precisa de rede para mostrar os produtos e as tuas encomendas.
        Verifica os dados móveis ou o Wi-Fi e tenta outra vez.
      </p>
    </div>
    <button onclick="tentar()">Tentar novamente</button>
    <div class="marca">INUKA Angola</div>

    <script>
      // O endereço tem de estar aqui escrito: esta página é servida de dentro
      // da app, onde o capacitor.config.ts não existe em tempo de execução.
      var SITE =
        "https://inuka-angola.apps.workbuddy.host/?sharecode=J27FVBMTIH";

      function tentar() {
        var botao = document.querySelector("button");
        botao.textContent = "A ligar…";
        botao.disabled = true;
        // `replace` e não `href`: sem isto o botão "voltar" do telefone
        // regressava sempre a esta página.
        location.replace(SITE);
        setTimeout(function () {
          botao.textContent = "Tentar novamente";
          botao.disabled = false;
        }, 4000);
      }

      window.addEventListener("online", tentar);
    </script>
  </body>
</html>
